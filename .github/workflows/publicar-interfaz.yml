name: Publicar interfaz de Foro Académico
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: publicacion-interfaz
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Construir la interfaz
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --base-href ./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  publicar:
    name: Publicar interfaz pública
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Comprobar el archivo de publicación
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for intento in {1..12}; do
            disponibles=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$disponibles" -gt 0 ]; then
              exit 0
            fi
            sleep 4
          done
          echo "El archivo de publicación todavía no está disponible."
          exit 1
      - name: Publicar interfaz
        id: publicacion
        uses: actions/deploy-pages@v4
