name: Publicar interfaz de Foro Académico
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicacion-interfaz
  cancel-in-progress: true

jobs:
  publicar:
    name: Compilar y publicar interfaz pública
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar Angular
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --base-href ./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser
      - name: Publicar interfaz
        id: publicacion
        uses: actions/deploy-pages@v4
